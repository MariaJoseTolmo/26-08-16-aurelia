name: Apply mobile dashboard safe area fix

on:
  push:
    branches:
      - feature/inspecciones/carlo
    paths:
      - '.github/workflows/mobile-dashboard-safe-area-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply safe area and gradient fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile-inspecciones/src/modules/inspection/MobileInspectionManagementScreen.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = "} from 'react-native';\n"
          new_import = "} from 'react-native';\nimport { SafeAreaView } from 'react-native-safe-area-context';\n"
          if "  SafeAreaView,\n" not in text:
              raise SystemExit('SafeAreaView import from react-native not found')
          text = text.replace("  SafeAreaView,\n", '', 1)
          if old_import not in text:
              raise SystemExit('react-native import boundary not found')
          text = text.replace(old_import, new_import, 1)

          old_header = '''function HeaderGradient() {
            return (
              <Svg style={StyleSheet.absoluteFill} width="100%" height="100%" preserveAspectRatio="none">
                <Defs>
                  <LinearGradient id="managementHeader" x1="0" y1="0" x2="0" y2="1">
                    <Stop offset="0%" stopColor="#012659" />
                    <Stop offset="100%" stopColor="#002659" />
                  </LinearGradient>
                </Defs>
                <Rect width="100%" height="100%" fill="url(#managementHeader)" />
              </Svg>
            );
          }
          '''
          new_header = '''function HeaderGradient() {
            return (
              <Svg
                pointerEvents="none"
                style={StyleSheet.absoluteFillObject}
                viewBox="0 0 1 1"
                preserveAspectRatio="none"
              >
                <Defs>
                  <LinearGradient
                    id="managementHeader"
                    x1={0}
                    y1={0}
                    x2={0}
                    y2={1}
                    gradientUnits="userSpaceOnUse"
                  >
                    <Stop offset="0%" stopColor="#012659" />
                    <Stop offset="100%" stopColor="#002659" />
                  </LinearGradient>
                </Defs>
                <Rect x={0} y={0} width={1} height={1} fill="url(#managementHeader)" />
              </Svg>
            );
          }
          '''
          if old_header not in text:
              raise SystemExit('Header gradient block not found')
          text = text.replace(old_header, new_header, 1)

          old_footer = '''function FooterGradient() {
            return (
              <Svg style={StyleSheet.absoluteFill} width="100%" height="100%" preserveAspectRatio="none">
                <Defs>
                  <LinearGradient id="managementFooter" x1="0" y1="0" x2="0" y2="1">
                    <Stop offset="2%" stopColor="#002659" />
                    <Stop offset="100%" stopColor="#004a3a" />
                  </LinearGradient>
                </Defs>
                <Rect width="100%" height="100%" fill="url(#managementFooter)" />
              </Svg>
            );
          }
          '''
          new_footer = '''function FooterGradient() {
            return (
              <Svg
                pointerEvents="none"
                style={StyleSheet.absoluteFillObject}
                viewBox="0 0 1 1"
                preserveAspectRatio="none"
              >
                <Defs>
                  <LinearGradient
                    id="managementFooter"
                    x1={0}
                    y1={0.0224}
                    x2={0}
                    y2={1.4019}
                    gradientUnits="userSpaceOnUse"
                  >
                    <Stop offset="0%" stopColor="#002659" />
                    <Stop offset="100%" stopColor="#004a3a" />
                  </LinearGradient>
                </Defs>
                <Rect x={0} y={0} width={1} height={1} fill="url(#managementFooter)" />
              </Svg>
            );
          }
          '''
          if old_footer not in text:
              raise SystemExit('Footer gradient block not found')
          text = text.replace(old_footer, new_footer, 1)

          target = '<SafeAreaView style={styles.safe}>'
          count = text.count(target)
          if count != 2:
              raise SystemExit(f'Expected 2 SafeAreaView usages, found {count}')
          text = text.replace(target, "<SafeAreaView style={styles.safe} edges={['top']}>")

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/mobile-dashboard-safe-area-fix.yml
          git add apps/mobile-inspecciones/src/modules/inspection/MobileInspectionManagementScreen.tsx .github/workflows/mobile-dashboard-safe-area-fix.yml
          git commit -m "fix(mobile): aplica safe area y gradiente estable al dashboard"
          git push origin HEAD:feature/inspecciones/carlo
