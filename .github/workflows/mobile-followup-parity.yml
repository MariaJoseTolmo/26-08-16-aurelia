name: Mobile followup parity

on:
  pull_request:
    branches:
      - feature/inspecciones/carlo

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'automation/mobile-followup-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch SVG tone support
        run: python .github/scripts/apply_mobile_followup_icon_tone.py

      - name: Commit SVG tone support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-inspecciones/src/modules/inspection/MobileInspectionDetailIcons.tsx
          git commit -m "fix(mobile): support exact SLA icon tones"

      - name: Patch mobile followups and actions
        run: python .github/scripts/apply_mobile_followup_parity.py modal

      - name: Validate contracts and mobile
        run: |
          pnpm --filter @aurelia/contracts build
          pnpm --filter mobile-inspecciones typecheck
          pnpm --filter mobile-inspecciones lint
          pnpm --filter mobile-inspecciones test:smoke

      - name: Commit mobile modal parity
        run: |
          git add apps/mobile-inspecciones/src/modules/inspection/MobileInspectionDetailModal.tsx
          git commit -m "fix(mobile): align followups and detail action icons"

      - name: Push working branch
        run: git push origin HEAD:feature/inspecciones/carlo
