name: Temporary integrate inspection SLA changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0

      - name: Merge inspection SLA work
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/residuos
          git merge --no-ff --no-edit origin/feature/residuos

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-sla-reason-layout-inspections.yml
          git commit -m "chore: remove temporary inspection SLA integration workflow"
          git push origin HEAD:feature/inspecciones/carlo
