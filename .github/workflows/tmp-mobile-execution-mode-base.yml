name: Temporary mobile execution mode base validation

on:
  pull_request:
    paths:
      - .github/validation/mobile-execution-mode-run.txt

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0

      - name: Apply implementation
        run: python .github/scripts/tmp_apply_mobile_execution_mode.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contracts and mobile
        run: |
          pnpm --filter @aurelia/contracts build
          pnpm --filter mobile-inspecciones typecheck
          pnpm --filter mobile-inspecciones lint
          pnpm --filter mobile-inspecciones test:smoke

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-inspecciones/src/modules/inspection/MobileInspectionDetailModal.tsx \
                  apps/mobile-inspecciones/src/modules/inspection/MobileFindingExecutionModal.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(mobile): add execution mode selection"
            git push origin HEAD:feature/inspecciones/carlo
          fi
