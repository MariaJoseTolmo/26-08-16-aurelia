name: Temporary mobile finding execution validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-mobile-finding-execution.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0

      - name: Apply execution view integration
        run: python .github/scripts/tmp_apply_mobile_finding_execution.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile app
        run: |
          pnpm --filter @aurelia/contracts build
          pnpm --filter mobile-inspecciones typecheck
          pnpm --filter mobile-inspecciones lint
          pnpm --filter mobile-inspecciones test:smoke

      - name: Commit modal integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-inspecciones/src/modules/inspection/MobileInspectionDetailModal.tsx
          git commit -m "feat(mobile): open full finding execution view"
          git push origin HEAD:feature/inspecciones/carlo

      - name: Remove temporary patch
        run: |
          git pull --ff-only origin feature/inspecciones/carlo
          git rm .github/scripts/tmp_apply_mobile_finding_execution.py
          git commit -m "chore(ci): remove finding execution patch"
          git push origin HEAD:feature/inspecciones/carlo

      - name: Remove temporary workflow
        run: |
          git pull --ff-only origin feature/inspecciones/carlo
          git rm .github/workflows/tmp-mobile-finding-execution.yml
          git commit -m "chore(ci): remove finding execution workflow"
          git push origin HEAD:feature/inspecciones/carlo
