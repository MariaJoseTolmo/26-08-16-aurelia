name: Temporary mobile icon fidelity validation

on:
  pull_request:
    paths:
      - .github/workflows/tmp-mobile-icon-fidelity.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0

      - name: Align mobile icons with Figma line style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          review = Path('apps/mobile-inspecciones/src/modules/inspection/MobileFindingReviewFeedback.tsx')
          text = review.read_text(encoding='utf-8')
          changes = {
              "import { FontAwesome5 } from '@expo/vector-icons';": "import { Feather } from '@expo/vector-icons';",
              '<FontAwesome5 name="info-circle" size={32} color="#24588b" />': '<Feather name="info" size={32} color="#24588b" />',
              '<FontAwesome5 name="times" size={22} color="#131313" />': '<Feather name="x" size={16} color="#131313" />',
              '<FontAwesome5 name="check-circle" size={24} color={colors.white} />': '<Feather name="check-circle" size={24} color={colors.white} />',
              '<FontAwesome5 name="times" size={20} color={colors.white} />': '<Feather name="x" size={20} color={colors.white} />',
          }
          for old, new in changes.items():
              if text.count(old) != 1:
                  raise SystemExit(f'{review}: expected one match for {old!r}, got {text.count(old)}')
              text = text.replace(old, new)
          review.write_text(text, encoding='utf-8')

          execution = Path('apps/mobile-inspecciones/src/modules/inspection/MobileFindingExecutionModal.tsx')
          text = execution.read_text(encoding='utf-8')
          text = text.replace("import { FontAwesome5 } from '@expo/vector-icons';", "import { Feather, FontAwesome5 } from '@expo/vector-icons';", 1)
          text = text.replace('<FontAwesome5 name="arrow-left"', '<Feather name="arrow-left"')
          text = text.replace('<FontAwesome5 name="arrow-right"', '<Feather name="arrow-right"')
          text = text.replace('<FontAwesome5 name="wifi"', '<Feather name="wifi-off"')
          text = re.sub(r'<FontAwesome5 name="camera"([^>]*) solid\s*/>', r'<Feather name="camera"\1 />', text)
          text = re.sub(r'<FontAwesome5 name="user"([^>]*) solid\s*/>', r'<Feather name="user"\1 />', text)
          text = text.replace('<FontAwesome5 name="list-ul"', '<Feather name="list"')
          text = text.replace('<FontAwesome5 name="check"', '<Feather name="check"')
          execution.write_text(text, encoding='utf-8')

          detail = Path('apps/mobile-inspecciones/src/modules/inspection/MobileInspectionDetailModal.tsx')
          text = detail.read_text(encoding='utf-8')
          text = text.replace("import { FontAwesome5 } from '@expo/vector-icons';", "import { Feather, FontAwesome5 } from '@expo/vector-icons';", 1)
          replacements = {
              '<FontAwesome5 name="times" size={20} color={colors.primary} />': '<Feather name="x" size={20} color={colors.primary} />',
              "<FontAwesome5 name={open ? 'chevron-up' : 'chevron-down'} size={12} color={colors.primary} solid />": "<Feather name={open ? 'chevron-up' : 'chevron-down'} size={16} color={colors.primary} />",
              '<FontAwesome5 name="times-circle" size={13} color={colors.dangerTxt} />': '<Feather name="x-circle" size={14} color={colors.dangerTxt} />',
              '<FontAwesome5 name="check-circle" size={13} color={colors.white} solid />': '<Feather name="check-circle" size={14} color={colors.white} />',
              '<FontAwesome5 name="user-plus" size={13} color={colors.blueLink} />': '<Feather name="user-plus" size={14} color={colors.blueLink} />',
              '<FontAwesome5 name="minus" size={14} color={colors.muted} />': '<Feather name="minus" size={14} color={colors.muted} />',
              '<FontAwesome5 name="plus" size={14} color={colors.muted} />': '<Feather name="plus" size={14} color={colors.muted} />',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'{detail}: icon target not found: {old}')
              text = text.replace(old, new)
          detail.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile icon changes
        run: |
          pnpm --filter @aurelia/contracts build
          pnpm --filter mobile-inspecciones typecheck
          pnpm --filter mobile-inspecciones lint
          pnpm --filter mobile-inspecciones test:smoke

      - name: Commit icon fidelity changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-inspecciones/src/modules/inspection/MobileFindingReviewFeedback.tsx \
                  apps/mobile-inspecciones/src/modules/inspection/MobileFindingExecutionModal.tsx \
                  apps/mobile-inspecciones/src/modules/inspection/MobileInspectionDetailModal.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(mobile): align recent inspection icons with Figma"
          git push origin HEAD:feature/inspecciones/carlo
