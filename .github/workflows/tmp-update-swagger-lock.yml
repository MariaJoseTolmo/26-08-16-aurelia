name: Temporary Swagger lockfile update

on:
  push:
    branches:
      - feature/inspecciones/carlo
    paths:
      - .github/workflows/tmp-update-swagger-lock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(api): update lockfile for Swagger"
          fi

          rm .github/workflows/tmp-update-swagger-lock.yml
          git add .github/workflows/tmp-update-swagger-lock.yml
          git commit -m "chore: remove temporary Swagger lockfile workflow"
          git push origin HEAD:feature/inspecciones/carlo
