name: Temporary Swagger runtime validation

on:
  push:
    branches:
      - feature/inspecciones/carlo
    paths:
      - .github/workflows/tmp-validate-swagger-runtime.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @aurelia/contracts clean
          pnpm --filter @aurelia/contracts build
          test -f packages/contracts/dist/cjs/enums/inspection-finding-severity.enum.js
          test -f packages/contracts/dist/cjs/enums/inspection-finding-severity.enum.d.ts
          pnpm --filter api build
          pnpm --filter api test:swagger-runtime
          pnpm --filter api test:swagger
          pnpm --filter api lint

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-validate-swagger-runtime.yml
          git add .github/workflows/tmp-validate-swagger-runtime.yml
          git commit -m "chore: remove temporary Swagger runtime validation workflow"
          git push origin HEAD:feature/inspecciones/carlo
