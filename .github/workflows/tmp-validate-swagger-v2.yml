name: Temporary Swagger v2 validation

on:
  push:
    branches:
      - feature/inspecciones/carlo
    paths:
      - .github/workflows/tmp-validate-swagger-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/inspecciones/carlo
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate Swagger iteration
        id: validate
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile > /tmp/install.log 2>&1
          install_status=$?
          pnpm --filter @aurelia/contracts build > /tmp/contracts.log 2>&1
          contracts_status=$?
          pnpm --filter api test:swagger > /tmp/swagger.log 2>&1
          swagger_status=$?
          pnpm --filter api build > /tmp/build.log 2>&1
          build_status=$?
          pnpm --filter api lint > /tmp/lint.log 2>&1
          lint_status=$?

          printf "install=%s\ncontracts=%s\nswagger=%s\nbuild=%s\nlint=%s\n" \
            "$install_status" "$contracts_status" "$swagger_status" "$build_status" "$lint_status" \
            > /tmp/status.txt

          cat /tmp/status.txt

          if [ "$install_status" -ne 0 ] || [ "$contracts_status" -ne 0 ] || [ "$swagger_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$lint_status" -ne 0 ]; then
            {
              echo "# Swagger v2 validation failure"
              echo
              cat /tmp/status.txt
              for log in install contracts swagger build lint; do
                echo
                echo "## $log"
                echo '```text'
                tail -n 120 "/tmp/$log.log"
                echo '```'
              done
            } > .github/swagger-v2-validation-failure.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/swagger-v2-validation-failure.md
            git commit -m "test(api): record Swagger v2 validation failure"
            git push origin HEAD:feature/inspecciones/carlo
            exit 1
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-validate-swagger-v2.yml
          git add .github/workflows/tmp-validate-swagger-v2.yml
          git commit -m "chore: remove temporary Swagger v2 validation workflow"
          git push origin HEAD:feature/inspecciones/carlo
